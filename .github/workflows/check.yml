name: Corpus check

# Opens and saves real Xcode projects with Xcodeproj and asks Xcode whether anything changed.
# Runs only on demand. Swift packages are resolved here, on a disposable runner, never locally.
on:
  workflow_dispatch:
    inputs:
      only_packages:
        description: 'Only projects that use Swift packages (1) or all (0)'
        default: '1'
      xcodeproj_pr:
        description: 'CocoaPods/Xcodeproj PR to compare with master'
        default: '1057'
      nanaimo_prs:
        description: 'CocoaPods/Nanaimo PRs merged onto master, checked as label "nanaimo" (Xcodeproj master with that Nanaimo); empty: none'
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      XCODE_DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ALLOW_PACKAGES: '1'
      ONLY_PACKAGES: ${{ inputs.only_packages }}
      SHARD: ${{ matrix.shard }}/4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'
      - name: Xcode version
        run: DEVELOPER_DIR="$XCODE_DEVELOPER_DIR" xcodebuild -version
      - name: Xcodeproj master and PR
        env:
          PR: ${{ inputs.xcodeproj_pr }}
        run: |
          gem install xcodeproj -v 1.28.1 --no-document   # brings the runtime dependencies
          git clone --quiet https://github.com/CocoaPods/Xcodeproj.git xp
          git -C xp fetch --quiet origin "pull/${PR}/head:pr"
          mkdir -p libs/master libs/pr
          git -C xp archive master lib | tar -x -C libs/master
          git -C xp archive pr lib | tar -x -C libs/pr
          echo "master $(git -C xp rev-parse --short master), PR #${PR} $(git -C xp rev-parse --short pr)"
      - name: Nanaimo master with PRs merged
        if: inputs.nanaimo_prs != ''
        env:
          PRS: ${{ inputs.nanaimo_prs }}
        # Only lib/ is used, so a conflict confined to spec/ keeps the side already merged; CHANGELOG.md merges by union.
        run: |
          git clone --quiet https://github.com/CocoaPods/Nanaimo.git nanaimo
          echo 'CHANGELOG.md merge=union' > nanaimo.attributes
          G=(git -C nanaimo -c core.attributesFile="$PWD/nanaimo.attributes" -c user.name=corpus -c user.email=corpus@localhost)
          read -r -a nums <<< "$PRS"
          for n in "${nums[@]}"; do
            [[ $n =~ ^[0-9]+$ ]] || { echo "not a PR number: $n"; exit 1; }
            git -C nanaimo fetch --quiet origin "pull/${n}/head:pr-${n}"
            if ! "${G[@]}" merge --quiet --no-edit "pr-${n}"; then
              conflicts=$(git -C nanaimo diff --name-only --diff-filter=U)
              if grep -qv '^spec/' <<< "$conflicts"; then echo "Nanaimo #${n} conflicts outside spec/: $conflicts"; exit 1; fi
              while IFS= read -r f; do git -C nanaimo checkout --ours -- "$f" && git -C nanaimo add -- "$f"; done <<< "$conflicts"
              "${G[@]}" commit --quiet --no-edit
              echo "Nanaimo #${n}: spec conflicts, kept the side already merged: $conflicts"
            fi
            echo "Nanaimo #${n} $(git -C nanaimo rev-parse --short "pr-${n}")"
          done
          echo "Nanaimo master $(git -C nanaimo rev-parse --short origin/master) + ${nums[*]/#/#}"
      - name: Fetch the project files
        run: ruby scripts/fetch.rb corpus.tsv corpus
      - name: Run
        # One line per finished project goes to this log; Xcodeproj warnings go to judge.log (in the artifact).
        run: |
          LIBS="{\"master\":\"$PWD/libs/master/lib\",\"pr\":\"$PWD/libs/pr/lib\""
          [ -d nanaimo ] && LIBS="$LIBS,\"nanaimo\":\"$PWD/nanaimo/lib:$PWD/libs/master/lib\""
          ruby scripts/judge.rb "$PWD/corpus" "$PWD/out" "$LIBS}" 3 2> judge.log
      - name: Summary
        if: always()
        run: |
          ruby scripts/summary.rb out/_results
          ruby scripts/summary.rb out/_results --markdown "Shard $SHARD" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: |
            out/_results
            judge.log

  report:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
      - name: All shards
        run: |
          ruby scripts/summary.rb results
          ruby scripts/summary.rb results --markdown >> "$GITHUB_STEP_SUMMARY"
