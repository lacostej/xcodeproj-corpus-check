name: Corpus check

# Opens and saves real Xcode projects with Xcodeproj and asks Xcode whether anything changed.
# Runs only on demand. Swift packages are resolved here, on a disposable runner, never locally.
on:
  workflow_dispatch:
    inputs:
      only_packages:
        description: 'Only projects that use Swift packages (1) or all (0)'
        default: '1'
      xcodeproj_prs:
        description: 'CocoaPods/Xcodeproj PRs merged onto master, label "xcodeproj" (and "all" with nanaimo_prs); empty: none'
        default: ''
      nanaimo_prs:
        description: 'CocoaPods/Nanaimo PRs merged onto master, label "nanaimo" (Xcodeproj master with that Nanaimo); empty: none'
        default: ''
      labels:
        description: 'Labels to judge, among master nanaimo xcodeproj all; rerun the projects "all" fails with "nanaimo xcodeproj" to see which side causes it'
        default: 'master all'
      json_lib:
        description: 'Label whose Xcodeproj opens the JSON format in the json check (all or xcodeproj); skipped if that label is absent'
        default: 'all'
      projects:
        description: 'Only the projects whose name matches this regular expression, e.g. "There|bad_query"; empty: all'
        default: ''
      master_from_run:
        description: 'Reuse the master checks of this earlier run (its ID) for each project whose master inputs are unchanged; empty: judge master'
        default: ''
      shards:
        description: 'Number of runners to split the projects across (1-20)'
        default: '8'
      json_edit:
        description: 'Run the JSON edit check (1) or skip it (0)'
        default: '1'

permissions:
  contents: read
  actions: read # gh run download, for master_from_run

jobs:
  shards:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          [[ "$SHARDS" =~ ^([1-9]|1[0-9]|20)$ ]] || { echo "shards must be 1-20, got $SHARDS"; exit 1; }
          echo "list=$(jq -cn --argjson n "$SHARDS" '[range($n)]')" >> "$GITHUB_OUTPUT"

  check:
    needs: shards
    runs-on: xcode-27
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    env:
      XCODE_DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ALLOW_PACKAGES: '1'
      ONLY_PACKAGES: ${{ inputs.only_packages }}
      SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'
      - name: Xcode version
        run: DEVELOPER_DIR="$XCODE_DEVELOPER_DIR" xcodebuild -version
      - name: Xcodeproj master
        run: |
          gem install xcodeproj -v 1.28.1 --no-document   # brings the runtime dependencies
          git clone --quiet https://github.com/CocoaPods/Xcodeproj.git xp
          mkdir -p libs/master
          git -C xp archive master lib | tar -x -C libs/master
          echo "master $(git -C xp rev-parse --short master)"
      - name: Merge the listed PRs
        # scripts/merge_prs.sh: CHANGELOG.md by union, recorded resolutions from resolutions/, spec-only conflicts keep the side
        # already merged; any other conflict fails the run.
        env:
          XP_PRS: ${{ inputs.xcodeproj_prs }}
          NANAIMO_PRS: ${{ inputs.nanaimo_prs }}
        run: |
          read -r -a xp_prs <<< "$XP_PRS"
          read -r -a nanaimo_prs <<< "$NANAIMO_PRS"
          if [ ${#xp_prs[@]} -gt 0 ]; then scripts/merge_prs.sh CocoaPods/Xcodeproj xp-merged "${xp_prs[@]}"; fi
          if [ ${#nanaimo_prs[@]} -gt 0 ]; then scripts/merge_prs.sh CocoaPods/Nanaimo nanaimo "${nanaimo_prs[@]}"; fi
      - name: Read SSH package URLs over HTTPS
        # Some projects pin packages as git@github.com:owner/repo; the runner has no SSH key for them.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Fetch the project files
        run: ruby scripts/fetch.rb corpus.tsv corpus
      - name: Master key
        # A digest of everything the master checks depend on; master_from_run reuses a project's master checks only if it matches.
        run: |
          key="xcodeproj $(git -C xp rev-parse master) nanaimo $(ruby -e 'puts Gem::Specification.find_by_name("nanaimo").version') ruby $(ruby -e 'puts RUBY_VERSION')"
          key+=" xcode $(DEVELOPER_DIR="$XCODE_DEVELOPER_DIR" xcodebuild -version | tr '\n' ' ')"
          key+=" files $(cat corpus.tsv scripts/judge.rb scripts/xp_save.rb scripts/fetch.rb | shasum -a 256 | cut -c1-16)"
          echo "master inputs: $key"
          echo "MASTER_KEY=$(printf '%s' "$key" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_ENV"
      - name: Master results from an earlier run
        if: inputs.master_from_run != ''
        env:
          RUN_ID: ${{ inputs.master_from_run }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "master_from_run must be a run ID, got $RUN_ID"; exit 1; }
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p 'results-*' -D earlier
          echo "MASTER_FROM=$PWD/earlier" >> "$GITHUB_ENV"
      - name: Run
        # One line per finished project goes to this log; Xcodeproj warnings go to judge.log (in the artifact).
        # Labels: master; nanaimo (Xcodeproj master + merged Nanaimo); xcodeproj (merged Xcodeproj); all (both merged).
        env:
          JSON_LIB: ${{ inputs.json_lib }}
          PROJECTS: ${{ inputs.projects }}
          LABELS: ${{ inputs.labels }}
          JSON_EDIT: ${{ inputs.json_edit }}
        run: |
          want() { [[ " $LABELS " == *" $1 "* ]]; }
          libs=()
          want master && libs+=("master=$PWD/libs/master/lib")
          want nanaimo && [ -d nanaimo ] && libs+=("nanaimo=$PWD/nanaimo/lib:$PWD/libs/master/lib")
          want xcodeproj && [ -d xp-merged ] && libs+=("xcodeproj=$PWD/xp-merged/lib")
          want all && [ -d nanaimo ] && [ -d xp-merged ] && libs+=("all=$PWD/nanaimo/lib:$PWD/xp-merged/lib")
          LIBS=$(ruby -rjson -e 'puts ARGV.to_h { |a| a.split("=", 2) }.to_json' "${libs[@]}")
          echo "libs: $LIBS"
          ruby scripts/judge.rb "$PWD/corpus" "$PWD/out" "$LIBS" 3 2> judge.log
      - name: Summary
        if: always()
        run: |
          ruby scripts/summary.rb out/_results
          ruby scripts/summary.rb out/_results --markdown "Shard $SHARD" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: |
            out/_results
            out/_logs
            judge.log

  report:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
      - name: All shards
        run: |
          ruby scripts/summary.rb results
          ruby scripts/summary.rb results --markdown >> "$GITHUB_STEP_SUMMARY"
